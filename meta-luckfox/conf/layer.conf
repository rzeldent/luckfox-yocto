BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "luckfox-project"
BBFILE_PATTERN_luckfox-project := "^${LAYERDIR}/"
BBFILE_PRIORITY_luckfox-project = "9"
LAYERDEPENDS_luckfox-project = "core rv110x"
LAYERSERIES_COMPAT_luckfox-project = "wrynose"
addpylib ${LAYERDIR}/lib luckfox_config
